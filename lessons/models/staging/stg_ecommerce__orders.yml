version: 2

models:
  - name: stg_ecommerce__orders
    description: >
      "Table of orders from the ecommerce platform, containing details about each order placed by users."
    
      "Include > for multi-line entries. Another line of description for the model, if needed"
    columns:
      - name: order_id
        data_type: int64
        description: ""
        tests:
          - primary_key:
              severity: error
          # - unique
          # - not_null

      - name: user_id
        tests:
          - not_null
        data_type: int64
        description: ""

      - name: status
        data_type: string
        description: ""
        tests:
          - accepted_values:
              name: valid_order_status # this is a custom name for the test, will print in the test results
              values: 
                - Returned
                - Shipped
                - Processing
                - Cancelled #the test failed because this status was not here in the list.
                - Complete

      - name: created_at
        tests:
          - not_null
        data_type: timestamp
        description: ""

      - name: returned_at
        tests:
          - not_null:
              where: "status = 'Returned'"
          - dbt_utils.expression_is_true:
              expression: ">= delivered_at" 
              where: "delivered_at IS NOT NULL AND returned_at IS NOT NULL"
        data_type: timestamp
        description: ""

      - name: shipped_at
        tests:
          - not_null:
              where: "delivered_at IS NOT NULL or status = 'Shipped'"
          - dbt_utils.expression_is_true:
              expression: ">= created_at"
              where: "shipped_at IS NOT NULL AND created_at IS NOT NULL"
        data_type: timestamp
        description: "When order shipped"

      - name: delivered_at
        data_type: timestamp
        description: ""

      - name: num_items_ordered
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
        data_type: int64
        description: ""

version: 2

models:
  - name: stg_ecommerce__products
    description: ""
    columns:
      - name: product_id
        tests:
          - not_null:
              severity: error
          - unique:
              severity: error
        data_type: int64
        description: ""

      - name: cost
        tests:
          - not_null:
              warn_if: ">10"
              error_if: ">100"
        data_type: float64
        description: ""

      - name: retail_price
        tests:
          - not_null
        data_type: float64
        description: ""

      - name: department
        tests:
          - not_null:
              warn_if: ">0"
              error_if: ">2" #the number of rows that violate the test
          - accepted_values:
              values:
                - "Women"
                - "Men"
              quote: true # this means that the values will be quoted in the test SQL
        data_type: string
        description: ""
        
      - name: brand
        data_type: string
        description: ""
version: 2

models:
  - name: stg_ecommerce__products
    description: ""
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
        data_type: int64
        description: ""

      - name: cost
        tests:
          - not_null
        data_type: float64
        description: ""

      - name: retail_price
        tests:
          - not_null
        data_type: float64
        description: ""

      - name: department
        tests:
          - not_null
          - accepted_values:
              values:
                - "Women"
                - "Men"
        data_type: string
        description: ""

      - name: brand
        data_type: string
        description: ""
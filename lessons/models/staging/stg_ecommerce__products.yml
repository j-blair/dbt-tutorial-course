version: 2

models:
  - name: stg_ecommerce__products
    description: "Table of products"
    # tests:
    #   - dbt_utils.expression_is_true:
    #       expression: "retail_price >= cost"
    columns:
      - name: product_id
        tests:
          - primary_key:
              severity: error
              # where: "department = 'Men'" # you can add a where clause to limit the scope of the test and it will be in the compiled target SQL
          # - unique:
          #     severity: error included in the primary_key test
        data_type: int64
        description: ""

      - name: cost
        tests:
          - not_null:
              warn_if: ">10"
              error_if: ">100"
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 10000
              severity: warn
        data_type: float64
        description: "Product purchase cost to the retailer"

      - name: retail_price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              severity: warn
          - dbt_utils.expression_is_true:
              name: retail_price_gte_cost 
              expression: ">= cost"
              # where: "retail_price IS NOT NULL AND cost IS NOT NULL"
              severity: error
        data_type: float64
        description: "Retail price of the product"

      - name: department
        tests:
          - not_null:
              warn_if: ">0"
              error_if: ">2" #the number of rows that violate the test
          - accepted_values:
              values:
                - "Women"
                - "Men"
              quote: true # this means that the values will be quoted in the test SQL
        data_type: string
        description: ""
        
      - name: brand
        data_type: string
        description: ""